name: Deploy SUCHARD to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build for GitHub Pages
        env:
          PUBLIC_SITE_URL: https://suchard-ent.github.io
          BASE_PATH: /suchard-ent/
          PUBLIC_PRODUCTION: 'false'
        run: npm run build
      - name: Validate bilingual copy
        run: node scripts/qa-copy.mjs
      - name: Validate Pages base path and assets
        run: node scripts/qa-pages.mjs
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages-availability:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl --silent --show-error --location \
            --output /tmp/github-pages.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [[ "${status}" == "200" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is enabled. The build will be deployed." >> "${GITHUB_STEP_SUMMARY}"
          elif [[ "${status}" == "404" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Site build verified. Deployment skipped: GitHub Pages is not enabled." >> "${GITHUB_STEP_SUMMARY}"
            echo "A private repository requires a Pages-supported plan. Once eligible, enable Settings > Pages > Build and deployment > GitHub Actions, then rerun this workflow or push to main." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Could not read Pages settings (HTTP ${status})." >&2
            cat /tmp/github-pages.json >&2
            exit 1
          fi

  deploy:
    needs:
      - build
      - pages-availability
    if: needs.pages-availability.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
